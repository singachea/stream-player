<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 360px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #11141b;
        color: #e8ebf2;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 10px 12px 8px;
        border-bottom: 1px solid #272e40;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .head-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #clear {
        border: 1px solid #272e40;
        border-radius: 6px;
        background: transparent;
        color: #8b95ad;
        font-size: 11px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #clear:hover {
        color: #e8ebf2;
        border-color: #3a4358;
      }
      #status {
        color: #8b95ad;
        font-size: 11px;
      }
      #list {
        max-height: 420px;
        overflow: auto;
      }
      .empty {
        padding: 16px 12px;
        color: #8b95ad;
      }
      .item {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px 12px;
        border-bottom: 1px solid #1c2130;
      }
      .item.fresh {
        background: #16241a;
      }
      .meta {
        min-width: 0;
        flex: 1;
      }
      .idx {
        flex-shrink: 0;
        min-width: 20px;
        color: #8b95ad;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .time {
        margin-top: 2px;
        color: #8b95ad;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .name {
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 12px;
        word-break: break-all;
      }
      .sub {
        margin-top: 2px;
        color: #8b95ad;
        font-size: 11px;
        word-break: break-all;
      }
      button.send {
        flex-shrink: 0;
        border: 0;
        border-radius: 6px;
        background: #16a34a;
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        padding: 6px 8px;
        cursor: pointer;
      }
      button.send:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Send to Play</h1>
      <div class="head-right">
        <div id="status">Watching…</div>
        <button id="clear" type="button" title="Clear this tab's list">Clear</button>
      </div>
    </header>
    <div id="list"></div>
    <script src="popup.js"></script>
  </body>
</html>
