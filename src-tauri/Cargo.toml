[package]
name = "stream-player"
version = "0.2.0"
description = "Play HLS/HTTP streams in VLC with seeking"
authors = ["you"]
edition = "2021"
default-run = "stream-player"

[lib]
name = "stream_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "play"
path = "src/bin/play.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-opener = "2"
tiny_http = "0.12"
url = "2"
tauri-plugin-deep-link = "2"

[dev-dependencies]
tempfile = "3"
